<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="assets/css/style.css" type="text/css">
</head>

<body>
    <section>

        <div id="desc">
            <div id="foto">
                <img src="assets/imgs/foto.jfif" alt="">
                <h3>Macelo Augusto</h3>
            </div>
            <div id="desc-text">
                <h3>Sobre min</h3>
                <p>
                    Desenvolvedor web com experiência em Python, Django, JavaScript, React, HTML/CSS, SQL Server e
                    SQLite3. Foco em desenvolvimento full stack com Django e React.
                </p>
            </div>
        </div>

        <div id="infos">
            <div id="links">
                <a href="https://www.instagram.com/macelo.mm/" target="_blank">
                    <div class="social-media" id="instagram">
                        <p>Instagram</p>
                        <div class="icon" id="instragram-icon"></div> 
                    </div>
                </a>
                <a href="">
                    <div class="social-media" id="discord">
                        <p>Discord</p>
                        <div class="icon" id="discord-icon"></div>
                    </div>
                </a>
                <a href="https://www.linkedin.com/in/macelomm/" target="_blank">
                    <div class="social-media" id="linkedin">
                        <p>Linkedin</p>
                        <div class="icon" id="lin-icon"></div>
                    </div>
                </a>
                <a href="https://github.com/MaceloMm" target="_blank">
                    <div class="social-media" id="github">
                        <p>GitHub</p>
                        <div class="icon" id="git-icon"></div>
                    </div>
                </a>
            </div>
            <a href="../../" id="port">
                <h3>Portifolio</h3>
            </a>
        </div>


    </section>
</body>

</html>
