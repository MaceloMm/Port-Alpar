<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="assets/js/scripts.js" defer></script>

    <style>
        .table tbody tr{
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <table class="table table-hover table-responsive" id="">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Nome</th>
                <th scope="col">Email</th>
                <th scope="col">Cargo</th>
            </tr>
            </thead>

            <tbody id="dados">
            </tbody>
        </table>
    </div>

    <div class="container mt-4">
        <div class="row row-cols-3 d-flex align-items-center justify-content-between">
            <button class="btn btn-primary col-3 w-25">Cadastrar</button>
            <button class="btn btn-warning col-3 w-25 text-black">Editar</button>
            <button class="btn btn-danger col-3 w-25" id="excluirButton">Excluir</button>
        </div>
    </div>

    <div class="container mt-3">
        <div class="alert d-none" role="alert" id="alert">
            A simple primary alert—check it out!
          </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
