<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de luzes</title>
    <link rel="stylesheet" href="assets/css/style.css" type="text/css">
    <script src="assets/javascript/scripts.js" defer></script>
    <link rel="shortcut icon" href="assets/images/lighton.png" type="icon">
</head>
<body>
    
    <div class="containerPrincipal">

        <div class="ligths">
            <div id="garagem" class="light">
                <h1>Garagem</h1>
            </div>
            <div id="banheiro" class="light">
                <h1>Banheiro</h1>
            </div>
            <div id="quartoP" class="light">
                <h1>Quarto</h1>
            </div>
            <div id="cozinha" class="light">
                <h1>Cozinha</h1>
            </div>
            <div id="salaJ" class="light">
                <h1>Sala</h1>
            </div>
        </div>

        <div class="buttons">
            <button class="btn" id="btnQuartoP" data-comodo="quartoP">
                <h2>Quarto Principal</h2>
                <img src="assets/images/lightoff.png" alt="">
            </button>
            <button class="btn" id="btnBanheiro" data-comodo="banheiro">
                <h2>Banheiro</h2>
                <img src="assets/images/lightoff.png" alt="">
            </button>
            <button class="btn" id="btnCozinha" data-comodo="cozinha">
                <h2>Cozinha</h2>
                <img src="assets/images/lightoff.png" alt="">
            </button>
            <button class="btn" id="btnSalaJ" data-comodo="salaJ">
                <h2>Sala de Jantar</h2>
                <img src="assets/images/lightoff.png" alt="">
            </button>
            <button class="btn" id="btnGaragem" data-comodo="garagem">
                <h2>Garagem</h2>
                <img src="assets/images/lightoff.png" alt="">
            </button>
            <button class="btn" id="btnTodas" data-comodo="">
                <h2>Acender Todas</h2>
                <img src="assets/images/lightoff.png" alt="">
            </button>
        </div>

    </div>

    <div class="footer">
        <a href="../../">Portfolio</a>
    </div>

</body>
</html>
